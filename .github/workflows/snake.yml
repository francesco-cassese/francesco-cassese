name: Generate Snake Animation

on:
  schedule:
    # Esegue l'aggiornamento ogni 12 ore
    - cron: "0 */12 * * *"
  
  # Permette di eseguire il workflow manualmente dalla tab Actions
  workflow_dispatch:
  
  # Esegue l'aggiornamento ogni volta che viene fatto un push sul main
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Crea l'animazione del serpente leggendo il grafico dei contributi dell'utente
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Invia il contenuto della cartella `dist` verso un branch chiamato `output`
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
